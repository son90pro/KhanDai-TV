name: Auto Update Playlist

on:
  schedule:
    - cron: '*/30 * * * *'  # Chạy tự động 30 phút một lần
  workflow_dispatch:        # Nút bấm chạy thủ công bằng tay

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Bước quan trọng nhất để sửa lỗi Exit Code 2 khi dùng Playwright
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push M3U File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto update playlist.m3u [skip ci]" && git push)
          
