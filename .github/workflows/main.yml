name: Tự động cập nhật M3U Khán Đài TV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Cấp quyền ghi cho GITHUB_TOKEN để push file khandai.m3u
permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper_khandai.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add khandai.m3u
          
          # Kiểm tra nếu file khandai.m3u có sự thay đổi mới commit và push
          if git status --porcelain | grep -q "khandai.m3u"; then
            git commit -m "Auto update khandai.m3u [skip ci]"
            git push
          else
            echo "Không có thay đổi mới trong file khandai.m3u."
          fi
          
