name: Auto Update Playlist

on:
  schedule:
    - cron: '0 */2 * * *'  # Tự động chạy cập nhật mỗi 2 tiếng
  workflow_dispatch:      # Cho phép bấm "Run workflow" thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Cấp quyền ghi để lưu và push file playlist.m3u

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
          
