name: Auto Update M3U Khán Đài TV

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ đúng tại phút 00
  workflow_dispatch: # Nút chạy thủ công trên GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push M3U file
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add khandai.m3u
        # Nếu có sự thay đổi (link mới) thì commit, không thì bỏ qua
        git diff-index --quiet HEAD || git commit -m "Auto-update list trận đấu"
        git push
        
