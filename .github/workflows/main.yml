name: update-iptv

on:
  schedule:
    - cron: '0 * * * *'  # Chạy tự động 1 tiếng / 1 lần
  workflow_dispatch:      # Cho phép bấm chạy thủ công

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        run: |
          python scraper_khandai.py

      - name: Auto Commit and Push M3U
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update playlist.m3u [skip ci]"
          file_pattern: 'playlist.m3u'
          
