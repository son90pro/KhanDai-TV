name: Tự động cập nhật M3U Khán Đài TV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Playwright (Trình duyệt giả lập)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Chạy Bot Cào Dữ Liệu
        run: python scraper.py

      - name: Lưu và đẩy file m3u lên Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add khandai.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Cập nhật link IPTV m3u8 mới nhất"
          git push
          
