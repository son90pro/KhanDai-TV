name: Auto Generate M3U Playlist

on:
  schedule:
    - cron: '0 */2 * * *' # Chạy tự động 2 giờ một lần
  workflow_dispatch: # Nút chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push M3U File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add khandai.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update IPTV playlist"
          git push
          
