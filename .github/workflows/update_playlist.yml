name: Update M3U Playlist Automatically

on:
  schedule:
    # Chạy tự động mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

# Cấp quyền ghi để GitHub Actions Bot có thể Push file playlist.m3u lên repo
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push M3U file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f playlist.m3u ]; then
            git add playlist.m3u
            git commit -m "Auto update playlist M3U [skip ci]" || echo "Không có thay đổi mới để commit"
            git push
          else
            echo "Không tìm thấy file playlist.m3u, bỏ qua commit."
          fi
          
